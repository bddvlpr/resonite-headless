name: Build Headless Image

on:
  workflow_dispatch:

concurrency:
  group: build-headless-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.prepare.outputs.build_id }}
      exists: ${{ steps.prepare.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - name: Check current public build
        id: prepare
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build_id=$(
            curl --fail --silent --show-error --retry 3 \
              'https://api.steamcmd.net/v1/info/2519830' |
            jq -er '.data["2519830"].depots.branches["public"].buildid'
          )
          [[ "$build_id" =~ ^[0-9]+$ ]] || {
            echo "Invalid public build ID: $build_id" >&2
            exit 1
          }
          exists=$(bash .github/scripts/image-exists.sh "$build_id")
          echo "Public build ID: $build_id; already published: $exists"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resonite-headless:latest
            ghcr.io/${{ github.repository_owner }}/resonite-headless:${{ needs.prepare.outputs.build_id }}
          secrets: |
            steam_username=${{ secrets.STEAM_USERNAME }}
            steam_password=${{ secrets.STEAM_PASSWORD }}
            steam_branch_password=${{ secrets.STEAM_BRANCH_PASSWORD }}
