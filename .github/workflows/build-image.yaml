name: Build Headless Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get current build ID
        id: build
        run: |
          BUILD_ID=$(
            curl --fail --silent --show-error --retry 3 \
              "https://api.steamcmd.net/v1/info/2519830" |
            jq -er '.data["2519830"].depots.branches["public"].buildid'
          )

          echo "Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resonite-headless:latest
            ghcr.io/${{ github.repository_owner }}/resonite-headless:${{ steps.build.outputs.build_id }}
          secrets: |
            steam_username=${{ secrets.STEAM_USERNAME }}
            steam_password=${{ secrets.STEAM_PASSWORD }}
            steam_branch_password=${{ secrets.STEAM_BRANCH_PASSWORD }}
